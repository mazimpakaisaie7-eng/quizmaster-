<script>
"use strict";

/* =====================================
   CONFIGURATION
===================================== */

const ARTICLES_URL = "./articles.json";

const LANGUAGE_KEY = "quizmasterLanguage";


/* =====================================
   TRANSLATIONS
===================================== */

const translations = {

  en: {
    pageTitle: "Learning Centre",

    pageDescription:
      "Explore useful lessons and improve your knowledge through English and Kinyarwanda articles.",

    searchPlaceholder: "Search lessons...",

    all: "All",

    general: "General Knowledge",

    traffic: "Road Safety",

    contact: "Contact",

    privacy: "Privacy Policy",

    terms: "Terms",

    loading: "Loading lessons...",

    results: "lessons found",

      "No lessons found. Try another search.",

    loadError:

    invalidData:

    definition: "Definition",

    body: "Main Lesson",

    keyPoints: "Key Points",

    conclusion: "Conclusion",

    footer:
      "© Quiz Master Rwanda. Learn • Play • Improve."
  },

  rw: {
    pageTitle: "Isomero ry'Ubwenge",

    pageDescription:
      "Soma amasomo agufasha kongera ubumenyi mu Kinyarwanda no mu Cyongereza.",

    searchPlaceholder: "Shakisha amasomo...",

    all: "Byose",

    general: "Ubumenyi Rusange",

    traffic: "Amategeko y'Umuhanda",

    readMore: "Soma isomo →",

    back: "← Subira ku masomo",

    home: "Ahabanza",

    about: "Abo turi bo",

    contact: "Twandikire",

    privacy: "Politiki y'Ibanga",

    terms: "Amategeko",

    loading: "Amasomo arimo gufunguka...",

    results: "amasomo yabonetse",

    noResults:
      "Nta somo ribonetse. Gerageza gushakisha andi magambo.",

    loadError:
      "Ntibishobotse gufungura amasomo. Reba internet wongere ugerageze.",

    invalidData:
      "Amakuru yo muri articles.json afite amakosa. Ongera ugenzure iyo dosiye.",

    articleNotFound:
      "Iri somo ntiryabonetse.",

    trafficLabel: "Amategeko y'Umuhanda",

    generalLabel: "Ubumenyi Rusange",

    definition: "Ibisobanuro",

    body: "Inyigisho irambuye",

    keyPoints: "Ingingo z'ingenzi",

    conclusion: "Umwanzuro",

    footer:
      "© Quiz Master Rwanda. Iga • Kina • Ongera ubumenyi."
  }

};


/* =====================================
   APPLICATION STATE
===================================== */

let articles = [];

let currentLanguage = "en";

let currentCategory = "all";

let currentSearch = "";

let currentArticleId = null;

let hasOpenedArticle = false;


/* =====================================
   HTML ELEMENTS
===================================== */

const elements = {

  languageBtn:
    document.getElementById("languageBtn"),

  homeLink:
    document.getElementById("homeLink"),

  pageTitle:
    document.getElementById("pageTitle"),

  pageDescription:
    document.getElementById("pageDescription"),

  searchInput:
    document.getElementById("searchInput"),

  filterButtons:
    document.querySelectorAll(".filter-btn"),

  resultsInfo:
    document.getElementById("resultsInfo"),

  articlesGrid:
    document.getElementById("articlesGrid"),

  emptyMessage:
    document.getElementById("emptyMessage"),

  listSection:
    document.getElementById("listSection"),

  readerSection:
    document.getElementById("readerSection"),

  readerCategory:
    document.getElementById("readerCategory"),

  readerTitle:
    document.getElementById("readerTitle"),

  readerDescription:
    document.getElementById("readerDescription"),

  readerContent:
    document.getElementById("readerContent"),

  backBtn:
    document.getElementById("backBtn"),

  errorMessage:
    document.getElementById("errorMessage"),

  footerText:
    document.getElementById("footerText"),

  footerHome:
    document.getElementById("footerHome"),

  footerAbout:
    document.getElementById("footerAbout"),

  footerContact:
    document.getElementById("footerContact"),

  footerPrivacy:
    document.getElementById("footerPrivacy"),

  footerTerms:
    document.getElementById("footerTerms")

};


/* =====================================
   TRANSLATION HELPER
===================================== */

function t(key) {

  return (
    translations[currentLanguage][key] ||
    translations.en[key] ||
    key
  );

}


/* =====================================
   LOCALIZED DATA SUPPORT

   Supports:
   - Normal strings
   - { en: "...", rw: "..." }
   - Localized arrays
===================================== */

function getLocalizedValue(value) {

  if (typeof value === "string") {
    return value;
  }

  if (Array.isArray(value)) {

    return value
      .map(item => getLocalizedValue(item))
      .filter(Boolean)
      .join("\n");

  }

  if (
    value &&
    typeof value === "object"
  ) {

    const selected =
      value[currentLanguage];

    if (hasContent(selected)) {

      return getLocalizedValue(selected);

    }

    const fallback =
      currentLanguage === "en"
        ? value.rw
        : value.en;

    if (hasContent(fallback)) {

      return getLocalizedValue(fallback);

    }

  }

  return "";

}


/* =====================================
   CHECK CONTENT
===================================== */

function hasContent(value) {

  if (typeof value === "string") {

    return value.trim().length > 0;

  }

  if (Array.isArray(value)) {

    return value.some(item => hasContent(item));

  }

  if (
    value &&
    typeof value === "object"
  ) {

    return (
      hasContent(value.en) ||
      hasContent(value.rw)
    );

  }

  return false;

}


/* =====================================
   GET ALL LANGUAGES FOR SEARCH
===================================== */

function getAllLocalizedText(value) {

  if (typeof value === "string") {
    return value;
  }

  if (Array.isArray(value)) {

    return value
      .map(item => getAllLocalizedText(item))
      .join(" ");

  }

  if (
    value &&
    typeof value === "object"
  ) {

    return Object.values(value)
      .map(item => getAllLocalizedText(item))
      .join(" ");

  }

  return "";

}


/* =====================================
   ARTICLE IDENTIFIER
===================================== */

function getArticleId(article) {

  return String(article.id);

}


/* =====================================
   VALIDATE ARTICLES JSON
===================================== */

function validateArticles(data) {

  if (
    !data ||
    typeof data !== "object" ||
    Array.isArray(data)
  ) {

    throw new Error("Invalid JSON structure.");

  }

  if (!Array.isArray(data.articles)) {

    throw new Error("Missing articles array.");

  }

  const validCategories = [
    "traffic",
    "general"
  ];

  const seenIds = new Set();

  const validArticles = [];

  data.articles.forEach(article => {

    if (
      !article ||
      typeof article !== "object" ||
      Array.isArray(article)
    ) {
      return;
    }

    if (
      (
        typeof article.id !== "string" &&
        typeof article.id !== "number"
      ) ||
      String(article.id).trim() === ""
    ) {
      return;
    }

    const id = getArticleId(article);

    if (seenIds.has(id)) {
      return;
    }

    if (
      typeof article.category !== "string" ||
      !validCategories.includes(article.category)
    ) {
      return;
    }

    const hasTitle =
      hasContent(article.title);

    const hasDescription =
      hasContent(article.description);

    const hasStructuredContent =
      hasContent(article.definition) ||
      hasContent(article.body) ||
      hasContent(article.key_points) ||
      hasContent(article.conclusion);

    const hasOldContent =
      hasContent(article.content);

    if (
      !hasTitle ||
      !hasDescription ||
      (
        !hasStructuredContent &&
        !hasOldContent
      )
    ) {
      return;
    }

    seenIds.add(id);

    validArticles.push(article);

  });

  if (validArticles.length === 0) {

    throw new Error("No valid articles found.");

  }

  return validArticles;

}


/* =====================================
   LOAD ARTICLES FROM JSON
===================================== */

async function loadArticles() {

  elements.resultsInfo.textContent =
    t("loading");

  elements.articlesGrid.innerHTML = "";

  elements.errorMessage.classList.add("hidden");

  try {

    const response = await fetch(
      ARTICLES_URL,
      {
        method: "GET",
        cache: "no-cache",
        headers: {
          "Accept": "application/json"
        }
      }
    );

    if (!response.ok) {

      throw new Error(
        "HTTP error: " + response.status
      );

    }

    const data = await response.json();

    articles = validateArticles(data);

    renderArticles();

    /* Support direct article links */

    const requestedId =
      new URLSearchParams(location.search)
        .get("article");

    if (requestedId) {

      openArticle(requestedId, false);

    }

  } catch (error) {

    console.error(
      "Quiz Master Articles Error:",
      error
    );

    elements.resultsInfo.textContent = "";

    elements.articlesGrid.innerHTML = "";

    elements.emptyMessage.classList.add("hidden");

    elements.errorMessage.textContent =
      error instanceof SyntaxError ||
      error.message.includes("Invalid") ||
      error.message.includes("Missing") ||
      error.message.includes("No valid")
        ? t("invalidData")
        : t("loadError");

    elements.errorMessage.classList.remove("hidden");

  }

}


/* =====================================
   CATEGORY LABEL
===================================== */

function getCategoryLabel(category) {

  if (category === "traffic") {

    return t("trafficLabel");

  }

  return t("generalLabel");

}


/* =====================================
   GET ALL SEARCHABLE ARTICLE TEXT
===================================== */

function getSearchableArticleText(article) {

  const fields = [

    article.id,

    article.category,

    getAllLocalizedText(article.title),

    getAllLocalizedText(article.description),

    getAllLocalizedText(article.definition),

    getAllLocalizedText(article.body),

    getAllLocalizedText(article.key_points),

    getAllLocalizedText(article.conclusion),

    getAllLocalizedText(article.content)

  ];

  return fields
    .join(" ")
    .toLowerCase();

}


/* =====================================
   SEARCH AND FILTER
===================================== */

function getFilteredArticles() {

  return articles.filter(article => {

    const matchesCategory =
      currentCategory === "all" ||
      article.category === currentCategory;

    const searchableText =
      getSearchableArticleText(article);

    const matchesSearch =
      searchableText.includes(
        currentSearch.toLowerCase()
      );

    return (
      matchesCategory &&
      matchesSearch
    );

  });

}


/* =====================================
   DISPLAY ARTICLES
===================================== */

function renderArticles() {

  const filteredArticles =
    getFilteredArticles();

  elements.articlesGrid.innerHTML = "";

  elements.emptyMessage.classList.add("hidden");

  elements.resultsInfo.textContent =
    filteredArticles.length +
    " " +
    t("results");

  if (filteredArticles.length === 0) {

    elements.emptyMessage.textContent =
      t("noResults");

    elements.emptyMessage.classList.remove("hidden");

    return;

  }

  filteredArticles.forEach(article => {

    const card =
      document.createElement("article");

    card.className = "article-card";

    const category =
      document.createElement("span");

    category.className = "category-label";

    category.textContent =
      getCategoryLabel(article.category);

    const title =
      document.createElement("h2");

    title.textContent =
      getLocalizedValue(article.title);

    const description =
      document.createElement("p");

    description.textContent =
      getLocalizedValue(article.description);

    const readButton =
      document.createElement("button");

    readButton.type = "button";

    readButton.className = "read-link";

    readButton.textContent =
      t("readMore");

    readButton.addEventListener(
      "click",
      () => openArticle(getArticleId(article), true)
    );

    card.appendChild(category);

    card.appendChild(title);

    card.appendChild(description);

    card.appendChild(readButton);

    elements.articlesGrid.appendChild(card);

  });

}


/* =====================================
   CREATE LESSON SECTION
===================================== */

function createLessonSection(title, value) {

  if (!hasContent(value)) {
    return null;
  }

  const section =
    document.createElement("section");

  section.className = "lesson-section";

  const heading =
    document.createElement("h2");

  heading.textContent = title;

  section.appendChild(heading);

  const content =
    getLocalizedValue(value);

  content
    .split("\n")
    .map(line => line.trim())
    .filter(Boolean)
    .forEach(line => {

      const paragraph =
        document.createElement("p");

      paragraph.textContent = line;

      section.appendChild(paragraph);

    });

  return section;

}


/* =====================================
   CREATE KEY POINTS SECTION
===================================== */

function createKeyPointsSection(value) {

  if (!hasContent(value)) {
    return null;
  }

  const section =
    document.createElement("section");

  section.className = "lesson-section";

  const heading =
    document.createElement("h2");

  heading.textContent =
    t("keyPoints");

  section.appendChild(heading);

  const list =
    document.createElement("ul");

  let points = [];

  if (Array.isArray(value)) {

    points = value.map(item =>
      getLocalizedValue(item)
    );

  } else if (
    value &&
    typeof value === "object"
  ) {

    const selected =
      value[currentLanguage];

    if (Array.isArray(selected)) {

      points = selected.map(item =>
        getLocalizedValue(item)
      );

    } else {

      points = getLocalizedValue(value)
        .split("\n");

    }

  } else {

    points = getLocalizedValue(value)
      .split("\n");

  }

  points
    .map(point => String(point).trim())
    .filter(Boolean)
    .forEach(point => {

      const item =
        document.createElement("li");

      item.textContent = point;

      list.appendChild(item);

    });

  if (list.children.length === 0) {
    return null;
  }

  section.appendChild(list);

  return section;

}


/* =====================================
   DISPLAY STRUCTURED ARTICLE
===================================== */

function renderStructuredArticle(article) {

  elements.readerContent.innerHTML = "";

  const sections = [

    createLessonSection(
      t("definition"),
      article.definition
    ),

    createLessonSection(
      t("body"),
      article.body
    ),

    createKeyPointsSection(
      article.key_points
    ),

    createLessonSection(
      t("conclusion"),
      article.conclusion
    )

  ];

  sections.forEach(section => {

    if (section) {

      elements.readerContent.appendChild(section);

    }

  });

}


/* =====================================
   DISPLAY LEGACY CONTENT
===================================== */

function renderLegacyContent(article) {

  elements.readerContent.innerHTML = "";

  const content =
    getLocalizedValue(article.content);

  if (!content.trim()) {
    return;
  }

  content
    .split("\n")
    .map(line => line.trim())
    .filter(Boolean)
    .forEach(line => {

      const paragraph =
        document.createElement("p");

      paragraph.textContent = line;

      elements.readerContent.appendChild(paragraph);

    });

}


/* =====================================
   OPEN ONE ARTICLE
===================================== */

function openArticle(articleId, addHistory = true) {

  const article =
    articles.find(item =>
      getArticleId(item) === String(articleId)
    );

  if (!article) {

    elements.errorMessage.textContent =
      t("articleNotFound");

    elements.errorMessage.classList.remove("hidden");

    return;

  }

  currentArticleId = getArticleId(article);

  elements.readerCategory.textContent =
    getCategoryLabel(article.category);

  elements.readerTitle.textContent =
    getLocalizedValue(article.title);

  elements.readerDescription.textContent =
    getLocalizedValue(article.description);

  const hasStructuredContent =
    hasContent(article.definition) ||
    hasContent(article.body) ||
    hasContent(article.key_points) ||
    hasContent(article.conclusion);

  if (hasStructuredContent) {

    renderStructuredArticle(article);

  } else {

    renderLegacyContent(article);

  }

  elements.listSection.classList.add("hidden");

  elements.readerSection.classList.remove("hidden");

  elements.errorMessage.classList.add("hidden");

  if (addHistory) {

    const url = new URL(location.href);

    url.searchParams.set(
      "article",
      currentArticleId
    );

    history.pushState(
      { articleId: currentArticleId },
      "",
      url
    );

    hasOpenedArticle = true;

  }

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================
   BACK TO ARTICLES
===================================== */

function showArticleList() {

  currentArticleId = null;

  elements.readerSection.classList.add("hidden");

  elements.listSection.classList.remove("hidden");

  elements.errorMessage.classList.add("hidden");

  const url = new URL(location.href);

  url.searchParams.delete("article");

  history.replaceState(
    { articleId: null },
    "",
    url
  );

  hasOpenedArticle = false;

  renderArticles();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================
   CHANGE LANGUAGE
===================================== */

function setLanguage(language) {

  if (
    language !== "en" &&
    language !== "rw"
  ) {
    return;
  }

  currentLanguage = language;

  try {

    localStorage.setItem(
      LANGUAGE_KEY,
      language
    );

  } catch (error) {

    console.warn("Language preference could not be saved.");

  }

  document.documentElement.lang =
    language;

  elements.languageBtn.textContent =
    language === "en"
      ? "Kinyarwanda"
      : "English";

  elements.pageTitle.textContent =
    t("pageTitle");

  elements.pageDescription.textContent =
    t("pageDescription");

  elements.searchInput.placeholder =
    t("searchPlaceholder");

  elements.searchInput.setAttribute(
    "aria-label",
    t("searchPlaceholder")
  );

  elements.homeLink.textContent =
    t("home");

  elements.footerHome.textContent =
    t("home");

  elements.footerAbout.textContent =
    t("about");

  elements.footerContact.textContent =
    t("contact");

  elements.footerPrivacy.textContent =
    t("privacy");

  elements.footerTerms.textContent =
    t("terms");

  elements.footerText.textContent =
    t("footer");

  elements.backBtn.textContent =
    t("back");

  elements.filterButtons.forEach(button => {

    const category =
      button.dataset.category;

    button.textContent =
      category === "all"
        ? t("all")
        : category === "traffic"
          ? t("traffic")
          : t("general");

  });

  if (currentArticleId) {

    openArticle(currentArticleId, false);

  } else {

    renderArticles();

  }

}


/* =====================================
   LANGUAGE BUTTON
===================================== */

elements.languageBtn.addEventListener(
  "click",
  () => {

    setLanguage(
      currentLanguage === "en"
        ? "rw"
        : "en"
    );

  }
);


/* =====================================
   SEARCH INPUT
===================================== */

elements.searchInput.addEventListener(
  "input",
  event => {

    currentSearch =
      event.target.value.trim();

    renderArticles();

  }
);


/* =====================================
   CATEGORY FILTERS
===================================== */

elements.filterButtons.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      currentCategory =
        button.dataset.category;

      elements.filterButtons.forEach(item => {

        item.classList.remove("active");

        item.setAttribute(
          "aria-pressed",
          "false"
        );

      });

      button.classList.add("active");

      button.setAttribute(
        "aria-pressed",
        "true"
      );

      renderArticles();

    }
  );

});


/* =====================================
   BACK BUTTON
===================================== */

elements.backBtn.addEventListener(
  "click",
  () => {

    if (hasOpenedArticle) {

      history.back();

    } else {

      showArticleList();

    }

  }
);


/* =====================================
   BROWSER BACK BUTTON
===================================== */

window.addEventListener(
  "popstate",
  event => {

    const articleId =
      event.state?.articleId ||
      new URLSearchParams(location.search)
        .get("article");

    if (articleId && articles.length) {

      openArticle(articleId, false);

    } else {

      currentArticleId = null;

      hasOpenedArticle = false;

      elements.readerSection.classList.add("hidden");

      elements.listSection.classList.remove("hidden");

      elements.errorMessage.classList.add("hidden");

      renderArticles();

    }

  }
);


/* =====================================
   START APPLICATION
===================================== */

let savedLanguage = "en";

try {

  const saved =
    localStorage.getItem(LANGUAGE_KEY);

  if (saved === "en" || saved === "rw") {

    savedLanguage = saved;

  }

} catch (error) {

  console.warn("Saved language is unavailable.");

}

setLanguage(savedLanguage);

loadArticles();


/* =====================================
   ADSENSE INITIALIZATION
   ONE AD UNIT ONLY ON THIS PAGE
===================================== */

function initializeLearningCentreAd() {

  const ad =
    document.querySelector(
      "#learningCentreAd .adsbygoogle"
    );

  if (!ad) {
    return;
  }

  if (ad.dataset.initialized === "true") {
    return;
  }

  try {

    (window.adsbygoogle =
      window.adsbygoogle || []).push({});

    ad.dataset.initialized = "true";

  } catch (error) {

    console.warn(
      "Learning Centre AdSense initialization failed:",
      error
    );

  }

}

if (document.readyState === "complete") {

  initializeLearningCentreAd();

} else {

  window.addEventListener(
    "load",
    initializeLearningCentreAd,
    { once: true }
  );

}

</script>

</body>
</html>
