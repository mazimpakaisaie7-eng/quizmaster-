
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Learning Centre | Quiz Master 🇷🇼</title>

  <meta name="description" content="Learn with Quiz Master Learning Centre. Explore general knowledge and road safety lessons in English and Kinyarwanda.">

  <meta name="keywords" content="Quiz Master Rwanda, Learning Centre, General Knowledge, Road Safety, Ikinyarwanda, English">

  <meta name="author" content="Quiz Master Rwanda">
  <meta name="robots" content="index, follow">

  <link rel="canonical" href="https://quizmaster-liard-five.vercel.app/articles.html">

  <link rel="icon" href="./icon-192-4.png">
  <link rel="apple-touch-icon" href="./icon-192-4.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <meta name="theme-color" content="#101827">

  <meta property="og:title" content="Learning Centre | Quiz Master 🇷🇼">
  <meta property="og:description" content="Explore educational lessons in English and Kinyarwanda.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://quizmaster-liard-five.vercel.app/articles.html">

  <style>
    :root {
      --bg: #101827;
      --panel: #182438;
      --panel2: #202f45;
      --text: #f1f5f9;
      --muted: #aab8ca;
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --border: #334155;
      --green: #22c55e;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.65;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
    }

    header {
      background: #0b1220;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .nav {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 0;
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
      color: white;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-button,
    .language-button {
      border: 1px solid var(--border);
      background: var(--panel);
      color: white;
      border-radius: 9px;
      padding: 8px 13px;
      font-weight: 700;
    }

    .nav-button:hover,
    .language-button:hover {
      border-color: var(--primary);
    }

    .hero {
      text-align: center;
      padding: 45px 12px 30px;
    }

    .hero h1 {
      font-size: clamp(27px, 5vw, 42px);
      margin: 0 0 10px;
      line-height: 1.2;
    }

    .hero p {
      color: var(--muted);
      max-width: 650px;
      margin: 0 auto;
    }

    .hero-tag {
      display: inline-block;
      color: #7dd3fc;
      background: #082f49;
      border: 1px solid #075985;
      border-radius: 30px;
      padding: 5px 13px;
      margin-bottom: 15px;
      font-size: 13px;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 13px;
      margin: 15px auto 25px;
    }

    .search-box {
      width: 100%;
      background: var(--panel);
      color: white;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 13px 15px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--primary);
    }

    .filters {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .filter-button {
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 8px 14px;
      background: var(--panel);
      color: var(--text);
      font-weight: 700;
    }

    .filter-button.active {
      background: var(--primary-dark);
      border-color: var(--primary);
      color: white;
    }

    .stats {
      color: var(--muted);
      font-size: 14px;
      margin: 12px 0;
    }

    .articles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 16px;
      padding-bottom: 30px;
    }

    .article-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 19px;
      display: flex;
      flex-direction: column;
      min-height: 220px;
      transition: transform .2s, border-color .2s;
    }

    .article-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
    }

    .category-label {
      display: inline-block;
      width: fit-content;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 20px;
      background: #082f49;
      color: #7dd3fc;
      margin-bottom: 11px;
    }

    .article-card h2 {
      font-size: 18px;
      line-height: 1.4;
      margin: 0 0 9px;
    }

    .article-card p {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 18px;
      flex: 1;
    }

    .read-button {
      width: 100%;
      border: none;
      border-radius: 9px;
      background: var(--primary-dark);
      color: white;
      padding: 10px 13px;
      font-weight: 800;
    }

    .read-button:hover {
      background: #0369a1;
    }

    .message {
      text-align: center;
      padding: 30px 15px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      margin: 20px 0 35px;
    }

    .message.error {
      color: #fecaca;
      border-color: #7f1d1d;
    }

    .message button {
      margin-top: 12px;
      padding: 9px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--primary-dark);
      color: white;
      font-weight: 700;
    }

    .reader {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: clamp(17px, 4vw, 32px);
      margin: 10px 0 35px;
    }

    .reader h2 {
      font-size: clamp(22px, 4vw, 30px);
      line-height: 1.3;
      margin: 10px 0;
    }

    .reader-description {
      color: var(--muted);
      margin: 0 0 20px;
      font-size: 15px;
    }

    .reader-content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.85;
      font-size: 16px;
      color: #e2e8f0;
    }

    .back-button {
      background: var(--panel2);
      color: white;
      border: 1px solid var(--border);
      padding: 9px 14px;
      border-radius: 9px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .back-button:hover {
      border-color: var(--primary);
    }

    .reader-footer {
      border-top: 1px solid var(--border);
      margin-top: 25px;
      padding-top: 17px;
    }

    .reader-footer a {
      color: #7dd3fc;
      font-weight: 700;
    }

    footer {
      border-top: 1px solid var(--border);
      margin-top: 25px;
      padding: 25px 10px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    footer a {
      color: #7dd3fc;
      margin: 0 7px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 520px) {
      .nav {
        justify-content: center;
      }

      .brand {
        width: 100%;
        text-align: center;
      }

      .nav-actions {
        justify-content: center;
      }

      .hero {
        padding-top: 30px;
      }

      .articles-grid {
        grid-template-columns: 1fr;
      }

      .article-card {
        min-height: 190px;
      }
    }
  </style>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Quiz Master Learning Centre",
    "url": "https://quizmaster-liard-five.vercel.app/articles.html",
    "description": "Educational lessons in English and Kinyarwanda about general knowledge and road safety.",
    "inLanguage": ["en", "rw"]
  }
  </script>
</head>

<body>

<header>
  <div class="container nav">
    <a class="brand" href="./index.html">🧠 Quiz Master 🇷🇼</a>

    <div class="nav-actions">
      <button class="language-button" id="languageButton" type="button">
        Kinyarwanda
      </button>

      <a class="nav-button" href="./index.html" id="homeLink">
        🏠 Home
      </a>
    </div>
  </div>
</header>

<main class="container">

  <section class="hero">
    <span class="hero-tag" id="heroTag">LEARN • DISCOVER • IMPROVE</span>

    <h1 id="pageTitle">📚 Learning Centre</h1>

    <p id="pageDescription">
      Explore educational lessons and improve your knowledge in different subjects.
    </p>
  </section>

  <section id="listSection">

    <div class="toolbar">

      <input
        type="search"
        id="searchInput"
        class="search-box"
        placeholder="Search lessons..."
        aria-label="Search lessons"
      >

      <div class="filters">
        <button
          class="filter-button active"
          data-category="all"
          type="button"
          id="allButton"
        >
          All Lessons
        </button>

        <button
          class="filter-button"
          data-category="general"
          type="button"
          id="generalButton"
        >
          🌍 General Knowledge
        </button>

        <button
          class="filter-button"
          data-category="traffic"
          type="button"
          id="trafficButton"
        >
          🚦 Road Safety
        </button>
      </div>

    </div>

    <div class="stats" id="stats">
      Loading lessons...
    </div>

    <div id="articlesGrid" class="articles-grid"></div>

    <div id="statusMessage" class="message hidden" role="status"></div>

  </section>

  <section id="readerSection" class="reader">

    <button class="back-button" id="backButton" type="button">
      ← Back to lessons
    </button>

    <span class="category-label" id="readerCategory"></span>

    <h2 id="readerTitle"></h2>

    <p class="reader-description" id="readerDescription"></p>

    <div class="reader-content" id="readerContent"></div>

    <div class="reader-footer">
      <button class="back-button" id="readerBackButton" type="button">
        ← Back to lessons
      </button>
      <p>
        <a href="./index.html" id="playLink">
          🧠 Go to Quiz Master
        </a>
      </p>
    </div>

  </section>

</main>

<footer>
  <p>© <span id="year"></span> Quiz Master 🇷🇼</p>

  <p id="footerText">
    Learn • Play • Improve
  </p>

  <p>
    <a href="./index.html" id="footerHome">Home</a>
    <a href="./about.html">About</a>
    <a href="./contact.html">Contact</a>
    <a href="./privacy-policy.html">Privacy</a>
  </p>
</footer>

<script>
(() => {
  "use strict";

  const ARTICLES_URL = "./articles.json";

  const translations = {
    en: {
      languageButton: "Kinyarwanda",
      home: "🏠 Home",
      heroTag: "LEARN • DISCOVER • IMPROVE",
      pageTitle: "📚 Learning Centre",
      pageDescription: "Explore educational lessons and improve your knowledge in different subjects.",
      search: "Search lessons...",
      all: "All Lessons",
      general: "🌍 General Knowledge",
      traffic: "🚦 Road Safety",
      loading: "Loading lessons...",
      loaded: "lessons available",
      read: "Read Lesson →",
      back: "← Back to lessons",
      play: "🧠 Go to Quiz Master",
      noResults: "No lessons found. Try another search.",
      loadError: "We could not load articles.json. Please check that the file exists in the root folder and contains valid JSON.",
      retry: "Try Again",
      generalName: "General Knowledge",
      trafficName: "Road Safety",
      footer: "Learn • Play • Improve"
    },

    rw: {
      languageButton: "English",
      home: "🏠 Ahabanza",
      heroTag: "IGA • MENYA • TERA IMBERE",
      pageTitle: "📚 Isomero ry'Amasomo",
      pageDescription: "Soma amasomo agufasha kongera ubumenyi mu byiciro bitandukanye.",
      search: "Shakisha isomo...",
      all: "Amasomo Yose",
      general: "🌍 Ubumenyi Rusange",
      traffic: "🚦 Umutekano wo mu Muhanda",
      loading: "Turimo gufungura amasomo...",
      loaded: "amasomo arahari",
      read: "Soma Isomo →",
      back: "← Subira ku masomo",
      play: "🧠 Jya kuri Quiz Master",
      noResults: "Nta somo ribonetse. Gerageza gushakisha irindi.",
      loadError: "Ntitwabashije gufungura articles.json. Reba niba dosiye ihari muri root folder kandi ifite JSON itunganye.",
      retry: "Ongera ugerageze",
      generalName: "Ubumenyi Rusange",
      trafficName: "Umutekano wo mu Muhanda",
      footer: "Iga • Kina • Tera Imbere"
    }
  };

  const elements = {
    languageButton: document.getElementById("languageButton"),
    homeLink: document.getElementById("homeLink"),
    heroTag: document.getElementById("heroTag"),
    pageTitle: document.getElementById("pageTitle"),
    pageDescription: document.getElementById("pageDescription"),
    searchInput: document.getElementById("searchInput"),
    allButton: document.getElementById("allButton"),
    generalButton: document.getElementById("generalButton"),
    trafficButton: document.getElementById("trafficButton"),
    stats: document.getElementById("stats"),
    articlesGrid: document.getElementById("articlesGrid"),
    statusMessage: document.getElementById("statusMessage"),
    listSection: document.getElementById("listSection"),
    readerSection: document.getElementById("readerSection"),
    backButton: document.getElementById("backButton"),
    readerBackButton: document.getElementById("readerBackButton"),
    readerCategory: document.getElementById("readerCategory"),
    readerTitle: document.getElementById("readerTitle"),
    readerDescription: document.getElementById("readerDescription"),
    readerContent: document.getElementById("readerContent"),
    playLink: document.getElementById("playLink"),
    footerText: document.getElementById("footerText"),
    footerHome: document.getElementById("footerHome")
  };

  let language = "en";
  let articles = [];
  let activeCategory = "all";
  let currentArticle = null;
  let isLoading = false;

  function getText(value) {
    if (typeof value === "string") {
      return value;
    }

    if (value && typeof value === "object") {
      return value[language] || value.en || value.rw || "";
    }

    return "";
  }

  function setLanguage(nextLanguage) {
    language = nextLanguage;

    const t = translations[language];

    document.documentElement.lang = language;

    elements.languageButton.textContent = t.languageButton;
    elements.homeLink.textContent = t.home;
    elements.heroTag.textContent = t.heroTag;
    elements.pageTitle.textContent = t.pageTitle;
    elements.pageDescription.textContent = t.pageDescription;
    elements.searchInput.placeholder = t.search;
    elements.searchInput.setAttribute("aria-label", t.search);

    elements.allButton.textContent = t.all;
    elements.generalButton.textContent = t.general;
    elements.trafficButton.textContent = t.traffic;

    elements.backButton.textContent = t.back;
    elements.readerBackButton.textContent = t.back;
    elements.playLink.textContent = t.play;
    elements.footerText.textContent = t.footer;
    elements.footerHome.textContent = language === "rw" ? "Ahabanza" : "Home";

    if (currentArticle) {
      showArticle(currentArticle, false);
    } else {
      renderArticles();
    }
  }

  function categoryName(category) {
    const t = translations[language];

    if (category === "traffic") {
      return t.trafficName;
    }

    return t.generalName;
  }

  function showMessage(message, isError = false, showRetry = false) {
    elements.statusMessage.replaceChildren();
    elements.statusMessage.classList.remove("hidden", "error");

    if (isError) {
      elements.statusMessage.classList.add("error");
    }

    const paragraph = document.createElement("p");
    paragraph.textContent = message;
    elements.statusMessage.appendChild(paragraph);

    if (showRetry) {
      const retryButton = document.createElement("button");
      retryButton.type = "button";
      retryButton.textContent = translations[language].retry;
      retryButton.addEventListener("click", loadArticles);
      elements.statusMessage.appendChild(retryButton);
    }
  }

  function hideMessage() {
    elements.statusMessage.classList.add("hidden");
    elements.statusMessage.replaceChildren();
  }

  function validateArticles(data) {
    if (
      !data ||
      typeof data !== "object" ||
      !Array.isArray(data.articles)
    ) {
      throw new Error("Invalid articles.json structure");
    }

    const validArticles = data.articles.filter(article => {
      return (
        article &&
        typeof article.id === "string" &&
        typeof article.category === "string" &&
        ["general", "traffic"].includes(article.category) &&
        article.title &&
        article.description &&
        article.content
      );
    });

    return validArticles;
  }

  async function loadArticles() {
    if (isLoading) return;

    isLoading = true;
    hideMessage();

    elements.stats.textContent = translations[language].loading;
    elements.articlesGrid.replaceChildren();

    try {
      const response = await fetch(ARTICLES_URL, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();

      articles = validateArticles(data);

      if (articles.length === 0) {
        throw new Error("No valid articles found");
      }

      renderArticles();

    } catch (error) {
      console.error("Quiz Master Articles Error:", error);

      articles = [];
      elements.stats.textContent = "";
      elements.articlesGrid.replaceChildren();

      showMessage(
        translations[language].loadError,
        true,
        true
      );

    } finally {
      isLoading = false;
    }
  }

  function getFilteredArticles() {
    const searchTerm = elements.searchInput.value
      .trim()
      .toLowerCase();

    return articles.filter(article => {
      const matchesCategory =
        activeCategory === "all" ||
        article.category === activeCategory;

      const title = getText(article.title).toLowerCase();
      const description = getText(article.description).toLowerCase();
      const content = getText(article.content).toLowerCase();

      const matchesSearch =
        !searchTerm ||
        title.includes(searchTerm) ||
        description.includes(searchTerm) ||
        content.includes(searchTerm);

      return matchesCategory && matchesSearch;
    });
  }

  function createArticleCard(article) {
    const t = translations[language];

    const card = document.createElement("article");
    card.className = "article-card";

    const category = document.createElement("span");
    category.className = "category-label";
    category.textContent = categoryName(article.category);

    const title = document.createElement("h2");
    title.textContent = getText(article.title);

    const description = document.createElement("p");
    description.textContent = getText(article.description);

    const button = document.createElement("button");
    button.type = "button";
    button.className = "read-button";
    button.textContent = t.read;

    button.addEventListener("click", () => {
      showArticle(article);
    });

    card.append(
      category,
      title,
      description,
      button
    );

    return card;
  }

  function renderArticles() {
    const t = translations[language];
    const filtered = getFilteredArticles();

    elements.articlesGrid.replaceChildren();
    hideMessage();

    elements.stats.textContent =
      filtered.length + " " + t.loaded;

    if (filtered.length === 0) {
      showMessage(t.noResults);
      return;
    }

    const fragment = document.createDocumentFragment();

    filtered.forEach(article => {
      fragment.appendChild(createArticleCard(article));
    });

    elements.articlesGrid.appendChild(fragment);
  }

  function showArticle(article, scroll = true) {
    if (!article) return;

    currentArticle = article;

    elements.listSection.classList.add("hidden");
    elements.readerSection.style.display = "block";

    elements.readerCategory.textContent =
      categoryName(article.category);

    elements.readerTitle.textContent =
      getText(article.title);

    elements.readerDescription.textContent =
      getText(article.description);

    elements.readerContent.textContent =
      getText(article.content);

    if (scroll) {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }
  }

  function showArticleList() {
    currentArticle = null;

    elements.readerSection.style.display = "none";
    elements.listSection.classList.remove("hidden");

    renderArticles();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  function selectCategory(category) {
    activeCategory = category;

    document.querySelectorAll(".filter-button").forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.category === category
      );
    });

    renderArticles();
  }

  elements.languageButton.addEventListener("click", () => {
    setLanguage(language === "en" ? "rw" : "en");
  });

  elements.searchInput.addEventListener("input", renderArticles);

  document.querySelectorAll(".filter-button").forEach(button => {
    button.addEventListener("click", () => {
      selectCategory(button.dataset.category);
    });
  });

  elements.backButton.addEventListener("click", showArticleList);
  elements.readerBackButton.addEventListener("click", showArticleList);

  document.getElementById("year").textContent =
    new Date().getFullYear();

  setLanguage("en");
  loadArticles();

})();
</script>

</body>
</html>
