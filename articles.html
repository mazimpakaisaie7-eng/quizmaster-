<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08172b">

  <title>Learning Centre | Quiz Master 🇷🇼</title>

  <meta
    name="description"
    content="Explore bilingual English and Kinyarwanda learning articles about road safety, science, geography, Rwanda and general knowledge."
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <link
    rel="canonical"
    href="https://quizmaster-liard-five.vercel.app/articles.html"
  >

  <style>
    :root {
      --bg: #08172b;
      --panel: #10233d;
      --panel-light: #172d49;
      --text: #f3f7ff;
      --muted: #aabbd0;
      --primary: #38bdf8;
      --border: rgba(255,255,255,.12);
      --success: #22c55e;
      --danger: #fb7185;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.65;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
    }

    header {
      background: #0c1d34;
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
      color: white;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--panel-light);
      color: white;
      border-radius: 9px;
      padding: 9px 14px;
      font-weight: 700;
      transition: .2s;
    }

    .btn:hover {
      border-color: var(--primary);
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #062033;
    }

    main {
      padding: 35px 0 55px;
    }

    .hero {
      text-align: center;
      margin-bottom: 30px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(27px, 5vw, 38px);
      line-height: 1.2;
    }

    .hero p {
      color: var(--muted);
      max-width: 680px;
      margin: 0 auto;
    }

    .controls {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 17px;
      margin-bottom: 22px;
    }

    .search-box {
      width: 100%;
      padding: 13px 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #08172b;
      color: white;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--primary);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 14px;
    }

    .filter-btn {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-weight: 700;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #062033;
      border-color: var(--primary);
    }

    .results-info {
      color: var(--muted);
      font-size: 14px;
      margin: 15px 2px;
    }

    .articles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 16px;
    }

    .article-card {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 18px;
      min-height: 190px;
      transition: transform .2s, border-color .2s;
    }

    .article-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
    }

    .category-label {
      display: inline-block;
      align-self: flex-start;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .5px;
      text-transform: uppercase;
      color: var(--primary);
      background: rgba(56,189,248,.12);
      border-radius: 20px;
      padding: 4px 9px;
      margin-bottom: 10px;
    }

    .article-card h2 {
      font-size: 18px;
      line-height: 1.35;
      margin: 0 0 9px;
    }

    .article-card p {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 16px;
    }

    .read-link {
      margin-top: auto;
      align-self: flex-start;
      color: var(--primary);
      background: transparent;
      border: none;
      padding: 0;
      font-weight: 800;
    }

    .reader {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: clamp(18px, 4vw, 30px);
    }

    .reader h1 {
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.3;
      margin: 12px 0;
    }

    .reader-description {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 24px;
    }

    .reader-content {
      color: #e2eaf5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 16px;
      line-height: 1.85;
    }

    .reader-content p {
      margin: 0 0 17px;
    }

    .back-btn {
      margin-bottom: 18px;
    }

    .message {
      text-align: center;
      padding: 35px 15px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .message.error {
      color: #fecaca;
      border-color: rgba(251,113,133,.4);
    }

    .hidden {
      display: none !important;
    }

    footer {
      border-top: 1px solid var(--border);
      background: #0c1d34;
      padding: 22px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-top: 9px;
    }

    .footer-links a:hover {
      color: var(--primary);
    }

    @media (max-width: 520px) {
      .header-inner {
        align-items: flex-start;
      }

      .brand {
        font-size: 16px;
      }

      .btn {
        padding: 8px 10px;
        font-size: 13px;
      }

      main {
        padding-top: 25px;
      }

      .articles-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container header-inner">

    <a class="brand" href="./index.html">
      🧠 Quiz Master 🇷🇼
    </a>

    <div class="header-actions">
      <button
        class="btn"
        id="languageBtn"
        type="button"
      >
        Kinyarwanda
      </button>

      <a
        class="btn btn-primary"
        href="./index.html"
        id="homeLink"
      >
        Home
      </a>
    </div>

  </div>
</header>

<main class="container">

  <section class="hero" id="heroSection">
    <h1 id="pageTitle">Learning Centre</h1>

    <p id="pageDescription">
      Explore useful lessons and improve your knowledge
      through English and Kinyarwanda articles.
    </p>
  </section>

  <section id="listSection">

    <div class="controls">

      <input
        type="search"
        id="searchInput"
        class="search-box"
        placeholder="Search lessons..."
        autocomplete="off"
        aria-label="Search lessons"
      >

      <div class="filters">

        <button
          class="filter-btn active"
          type="button"
          data-category="all"
        >
          All
        </button>

        <button
          class="filter-btn"
          type="button"
          data-category="general"
        >
          General Knowledge
        </button>

        <button
          class="filter-btn"
          type="button"
          data-category="traffic"
        >
          Road Safety
        </button>

      </div>

    </div>

    <p
      class="results-info"
      id="resultsInfo"
      aria-live="polite"
    >
      Loading lessons...
    </p>

    <div
      class="articles-grid"
      id="articlesGrid"
    ></div>

    <div
      class="message hidden"
      id="emptyMessage"
    >
      No lessons found.
    </div>

  </section>

  <section
    class="reader hidden"
    id="readerSection"
  >

    <button
      class="btn back-btn"
      id="backBtn"
      type="button"
    >
      ← Back to lessons
    </button>

    <div id="readerCategory" class="category-label"></div>

    <h1 id="readerTitle"></h1>

    <p
      class="reader-description"
      id="readerDescription"
    ></p>

    <div
      class="reader-content"
      id="readerContent"
    ></div>

  </section>

  <div
    class="message hidden"
    id="errorMessage"
    role="alert"
  ></div>

</main>

<footer>
  <div class="container">

    <div id="footerText">
      © Quiz Master Rwanda. Learn • Play • Improve.
    </div>

    <nav class="footer-links">

      <a href="./index.html" id="footerHome">Home</a>

      <a href="./about.html" id="footerAbout">About</a>

      <a href="./contact.html" id="footerContact">Contact</a>

      <a href="./privacy-policy.html" id="footerPrivacy">
        Privacy Policy
      </a>

      <a href="./terms.html" id="footerTerms">
        Terms
      </a>

    </nav>

  </div>
</footer>

<script>
"use strict";

/* =====================================
   QUIZ MASTER ARTICLES CONFIGURATION
===================================== */

const ARTICLES_URL = "./articles.json";

const translations = {

  en: {
    pageTitle: "Learning Centre",

    pageDescription:
      "Explore useful lessons and improve your knowledge through English and Kinyarwanda articles.",

    searchPlaceholder: "Search lessons...",

    all: "All",

    general: "General Knowledge",

    traffic: "Road Safety",

    readMore: "Read lesson →",

    back: "← Back to lessons",

    home: "Home",

    about: "About",

    contact: "Contact",

    privacy: "Privacy Policy",

    terms: "Terms",

    loading: "Loading lessons...",

    results: "lessons found",

    noResults: "No lessons found. Try another search.",

    loadError:
      "Unable to load lessons. Please check your internet connection and try again.",

    invalidData:
      "The articles file contains invalid data. Please check articles.json.",

    articleNotFound:
      "This lesson could not be found.",

    trafficLabel: "Road Safety",

    generalLabel: "General Knowledge",

    footer:
      "© Quiz Master Rwanda. Learn • Play • Improve."
  },

  rw: {
    pageTitle: "Isomero ry'Ubwenge",

    pageDescription:
      "Soma amasomo agufasha kongera ubumenyi mu Kinyarwanda no mu Cyongereza.",

    searchPlaceholder: "Shakisha amasomo...",

    all: "Byose",

    general: "Ubumenyi Rusange",

    traffic: "Amategeko y'Umuhanda",

    readMore: "Soma isomo →",

    back: "← Subira ku masomo",

    home: "Ahabanza",

    about: "Abo turi bo",

    contact: "Twandikire",

    privacy: "Politiki y'Ibanga",

    terms: "Amategeko",

    loading: "Amasomo arimo gufunguka...",

    results: "amasomo yabonetse",

    noResults:
      "Nta somo ribonetse. Gerageza gushakisha andi magambo.",

    loadError:
      "Ntibishobotse gufungura amasomo. Reba internet wongere ugerageze.",

    invalidData:
      "Amakuru yo muri articles.json afite amakosa. Ongera ugenzure iyo dosiye.",

    articleNotFound:
      "Iri somo ntiryabonetse.",

    trafficLabel: "Amategeko y'Umuhanda",

    generalLabel: "Ubumenyi Rusange",

    footer:
      "© Quiz Master Rwanda. Iga • Kina • Ongera ubumenyi."
  }

};


/* =====================================
   APPLICATION STATE
===================================== */

let articles = [];

let currentLanguage = "en";

let currentCategory = "all";

let currentSearch = "";

let currentArticleId = null;


/* =====================================
   HTML ELEMENTS
===================================== */

const elements = {

  languageBtn: document.getElementById("languageBtn"),

  homeLink: document.getElementById("homeLink"),

  pageTitle: document.getElementById("pageTitle"),

  pageDescription:
    document.getElementById("pageDescription"),

  searchInput:
    document.getElementById("searchInput"),

  filterButtons:
    document.querySelectorAll(".filter-btn"),

  resultsInfo:
    document.getElementById("resultsInfo"),

  articlesGrid:
    document.getElementById("articlesGrid"),

  emptyMessage:
    document.getElementById("emptyMessage"),

  listSection:
    document.getElementById("listSection"),

  readerSection:
    document.getElementById("readerSection"),

  readerCategory:
    document.getElementById("readerCategory"),

  readerTitle:
    document.getElementById("readerTitle"),

  readerDescription:
    document.getElementById("readerDescription"),

  readerContent:
    document.getElementById("readerContent"),

  backBtn:
    document.getElementById("backBtn"),

  errorMessage:
    document.getElementById("errorMessage"),

  footerText:
    document.getElementById("footerText"),

  footerHome:
    document.getElementById("footerHome"),

  footerAbout:
    document.getElementById("footerAbout"),

  footerContact:
    document.getElementById("footerContact"),

  footerPrivacy:
    document.getElementById("footerPrivacy"),

  footerTerms:
    document.getElementById("footerTerms")

};


/* =====================================
   LANGUAGE HELPERS
===================================== */

function t(key) {

  return translations[currentLanguage][key]
    || translations.en[key]
    || key;

}


function getText(value) {

  if (typeof value === "string") {
    return value;
  }

  if (
    value &&
    typeof value === "object" &&
    !Array.isArray(value)
  ) {

    const selected =
      value[currentLanguage];

    if (
      typeof selected === "string" &&
      selected.trim()
    ) {
      return selected;
    }

    const english = value.en;

    if (
      typeof english === "string" &&
      english.trim()
    ) {
      return english;
    }

    const kinyarwanda = value.rw;

    if (
      typeof kinyarwanda === "string" &&
      kinyarwanda.trim()
    ) {
      return kinyarwanda;
    }

  }

  return "";

}


/* =====================================
   VALIDATE ARTICLES JSON
===================================== */

function validateArticles(data) {

  if (
    !data ||
    typeof data !== "object" ||
    Array.isArray(data)
  ) {
    throw new Error("Invalid JSON structure.");
  }

  if (
    !Array.isArray(data.articles)
  ) {
    throw new Error("Missing articles array.");
  }

  const validCategories = [
    "traffic",
    "general"
  ];

  const seenIds = new Set();

  const validArticles = data.articles.filter(article => {

    if (
      !article ||
      typeof article !== "object" ||
      Array.isArray(article)
    ) {
      return false;
    }

    if (
      typeof article.id !== "string" ||
      !article.id.trim()
    ) {
      return false;
    }

    if (seenIds.has(article.id)) {
      return false;
    }

    if (
      typeof article.category !== "string" ||
      !validCategories.includes(article.category)
    ) {
      return false;
    }

    const hasTitle =
      getText(article.title).trim().length > 0 ||
      (
        article.title &&
        typeof article.title === "object" &&
        (
          typeof article.title.en === "string" ||
          typeof article.title.rw === "string"
        )
      );

    const hasDescription =
      getText(article.description).trim().length > 0 ||
      (
        article.description &&
        typeof article.description === "object" &&
        (
          typeof article.description.en === "string" ||
          typeof article.description.rw === "string"
        )
      );

    const hasContent =
      getText(article.content).trim().length > 0 ||
      (
        article.content &&
        typeof article.content === "object" &&
        (
          typeof article.content.en === "string" ||
          typeof article.content.rw === "string"
        )
      );

    if (
      !hasTitle ||
      !hasDescription ||
      !hasContent
    ) {
      return false;
    }

    seenIds.add(article.id);

    return true;

  });

  if (validArticles.length === 0) {
    throw new Error("No valid articles found.");
  }

  return validArticles;

}


/* =====================================
   LOAD ARTICLES FROM JSON
===================================== */

async function loadArticles() {

  elements.resultsInfo.textContent =
    t("loading");

  elements.articlesGrid.innerHTML = "";

  elements.errorMessage.classList.add("hidden");

  try {

    const response = await fetch(
      ARTICLES_URL,
      {
        method: "GET",
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        "HTTP error: " + response.status
      );
    }

    const data = await response.json();

    articles = validateArticles(data);

    renderArticles();

  } catch (error) {

    console.error(
      "Quiz Master Articles Error:",
      error
    );

    elements.resultsInfo.textContent = "";

    elements.articlesGrid.innerHTML = "";

    elements.errorMessage.textContent =
      error instanceof SyntaxError
        ? t("invalidData")
        : t("loadError");

    elements.errorMessage.classList.remove("hidden");

  }

}


/* =====================================
   CATEGORY LABEL
===================================== */

function getCategoryLabel(category) {

  if (category === "traffic") {
    return t("trafficLabel");
  }

  return t("generalLabel");

}


/* =====================================
   SEARCH AND FILTER
===================================== */

function getFilteredArticles() {

  return articles.filter(article => {

    const matchesCategory =
      currentCategory === "all" ||
      article.category === currentCategory;

    const searchableText = [

      getText(article.title),

      getText(article.description),

      getText(article.content),

      article.id,

      article.category

    ].join(" ").toLowerCase();

    const matchesSearch =
      searchableText.includes(
        currentSearch.toLowerCase()
      );

    return matchesCategory && matchesSearch;

  });

}


/* =====================================
   DISPLAY ARTICLES
===================================== */

function renderArticles() {

  const filteredArticles =
    getFilteredArticles();

  elements.articlesGrid.innerHTML = "";

  elements.emptyMessage.classList.add("hidden");

  elements.resultsInfo.textContent =
    filteredArticles.length + " " + t("results");

  if (filteredArticles.length === 0) {

    elements.emptyMessage.textContent =
      t("noResults");

    elements.emptyMessage.classList.remove("hidden");

    return;

  }

  filteredArticles.forEach(article => {

    const card = document.createElement("article");

    card.className = "article-card";

    const category = document.createElement("span");

    category.className = "category-label";

    category.textContent =
      getCategoryLabel(article.category);

    const title = document.createElement("h2");

    title.textContent =
      getText(article.title);

    const description = document.createElement("p");

    description.textContent =
      getText(article.description);

    const readButton = document.createElement("button");

    readButton.type = "button";

    readButton.className = "read-link";

    readButton.textContent = t("readMore");

    readButton.addEventListener("click", () => {

      openArticle(article.id);

    });

    card.appendChild(category);

    card.appendChild(title);

    card.appendChild(description);

    card.appendChild(readButton);

    elements.articlesGrid.appendChild(card);

  });

}


/* =====================================
   OPEN ONE ARTICLE
===================================== */

function openArticle(articleId) {

  const article = articles.find(item => {

    return item.id === articleId;

  });

  if (!article) {

    elements.errorMessage.textContent =
      t("articleNotFound");

    elements.errorMessage.classList.remove("hidden");

    return;

  }

  currentArticleId = articleId;

  elements.readerCategory.textContent =
    getCategoryLabel(article.category);

  elements.readerTitle.textContent =
    getText(article.title);

  elements.readerDescription.textContent =
    getText(article.description);

  elements.readerContent.textContent =
    getText(article.content);

  elements.listSection.classList.add("hidden");

  elements.readerSection.classList.remove("hidden");

  elements.errorMessage.classList.add("hidden");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================
   BACK TO ARTICLES
===================================== */

function showArticleList() {

  currentArticleId = null;

  elements.readerSection.classList.add("hidden");

  elements.listSection.classList.remove("hidden");

  elements.errorMessage.classList.add("hidden");

  renderArticles();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================
   CHANGE LANGUAGE
===================================== */

function setLanguage(language) {

  if (
    language !== "en" &&
    language !== "rw"
  ) {
    return;
  }

  currentLanguage = language;

  document.documentElement.lang = language;

  elements.languageBtn.textContent =
    language === "en"
      ? "Kinyarwanda"
      : "English";

  elements.pageTitle.textContent =
    t("pageTitle");

  elements.pageDescription.textContent =
    t("pageDescription");

  elements.searchInput.placeholder =
    t("searchPlaceholder");

  elements.searchInput.setAttribute(
    "aria-label",
    t("searchPlaceholder")
  );

  elements.homeLink.textContent =
    t("home");

  elements.footerHome.textContent =
    t("home");

  elements.footerAbout.textContent =
    t("about");

  elements.footerContact.textContent =
    t("contact");

  elements.footerPrivacy.textContent =
    t("privacy");

  elements.footerTerms.textContent =
    t("terms");

  elements.footerText.textContent =
    t("footer");

  elements.backBtn.textContent =
    t("back");

  elements.filterButtons.forEach(button => {

    const category =
      button.dataset.category;

    button.textContent =
      category === "all"
        ? t("all")
        : category === "traffic"
          ? t("traffic")
          : t("general");

  });

  if (currentArticleId) {

    openArticle(currentArticleId);

  } else {

    renderArticles();

  }

}


/* =====================================
   EVENT LISTENERS
===================================== */

elements.languageBtn.addEventListener(
  "click",
  () => {

    setLanguage(
      currentLanguage === "en"
        ? "rw"
        : "en"
    );

  }
);


elements.searchInput.addEventListener(
  "input",
  event => {

    currentSearch =
      event.target.value.trim();

    renderArticles();

  }
);


elements.filterButtons.forEach(button => {

  button.addEventListener("click", () => {

    currentCategory =
      button.dataset.category;

    elements.filterButtons.forEach(item => {

      item.classList.remove("active");

    });

    button.classList.add("active");

    renderArticles();

  });

});


elements.backBtn.addEventListener(
  "click",
  showArticleList
);


/* =====================================
   START APPLICATION
===================================== */

setLanguage("en");

loadArticles();

</script>

</body>
</html>
