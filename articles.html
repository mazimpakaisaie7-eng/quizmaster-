
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08172b">

  <title>Learning Centre | Quiz Master 🇷🇼</title>

  <meta
    name="description"
    content="Explore bilingual English and Kinyarwanda learning articles about road safety, science, geography, Rwanda and general knowledge."
  >

  <meta name="robots" content="index, follow">

  <link
    rel="canonical"
    href="https://quizmaster-liard-five.vercel.app/articles.html"
  >

  <style>
    :root {
      --bg: #08172b;
      --panel: #10233d;
      --panel-light: #172d49;
      --text: #f3f7ff;
      --muted: #aabbd0;
      --primary: #38bdf8;
      --border: rgba(255,255,255,.12);
      --success: #22c55e;
      --danger: #fb7185;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.65;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
    }

    header {
      background: #0c1d34;
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
      color: white;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--panel-light);
      color: white;
      border-radius: 9px;
      padding: 9px 14px;
      font-weight: 700;
      transition: .2s;
    }

    .btn:hover {
      border-color: var(--primary);
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #062033;
    }

    main {
      padding: 35px 0 55px;
      min-height: 70vh;
    }

    .hero {
      text-align: center;
      margin-bottom: 30px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(27px, 5vw, 38px);
      line-height: 1.2;
    }

    .hero p {
      color: var(--muted);
      max-width: 680px;
      margin: 0 auto;
    }

    .controls {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 17px;
      margin-bottom: 22px;
    }

    .search-box {
      width: 100%;
      padding: 13px 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #08172b;
      color: white;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--primary);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 14px;
    }

    .filter-btn {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-weight: 700;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #062033;
      border-color: var(--primary);
    }

    .results-info {
      color: var(--muted);
      font-size: 14px;
      margin: 15px 2px;
    }

    .articles-grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(245px, 1fr)
      );
      gap: 16px;
    }

    .article-card {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 18px;
      min-height: 190px;
      transition: transform .2s, border-color .2s;
    }

    .article-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
    }

    .category-label {
      display: inline-block;
      align-self: flex-start;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .5px;
      text-transform: uppercase;
      color: var(--primary);
      background: rgba(56,189,248,.12);
      border-radius: 20px;
      padding: 4px 9px;
      margin-bottom: 10px;
    }

    .article-card h2 {
      font-size: 18px;
      line-height: 1.35;
      margin: 0 0 9px;
    }

    .article-card p {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 16px;
    }

    .read-link {
      margin-top: auto;
      align-self: flex-start;
      color: var(--primary);
      background: transparent;
      border: none;
      padding: 0;
      font-weight: 800;
    }

    .reader {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: clamp(18px, 4vw, 30px);
    }

    .reader h1 {
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.3;
      margin: 12px 0;
    }

    .reader-description {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 24px;
    }

    .reader-content {
      color: #e2eaf5;
      overflow-wrap: anywhere;
      font-size: 16px;
      line-height: 1.85;
    }

    .reader-content p {
      margin: 0 0 17px;
      white-space: pre-wrap;
    }

    .lesson-section {
      margin: 25px 0;
      padding: 19px;
      background: #0c1d34;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .lesson-section h2 {
      color: var(--primary);
      font-size: 19px;
      line-height: 1.4;
      margin: 0 0 13px;
    }

    .lesson-section p {
      margin-bottom: 12px;
    }

    .lesson-section ul {
      margin: 0;
      padding-left: 23px;
    }

    .lesson-section li {
      margin-bottom: 10px;
      padding-left: 3px;
    }

    .lesson-section li:last-child {
      margin-bottom: 0;
    }

    .back-btn {
      margin-bottom: 18px;
    }

    .message {
      text-align: center;
      padding: 35px 15px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .message.error {
      color: #fecaca;
      border-color: rgba(251,113,133,.4);
    }

    .hidden {
      display: none !important;
    }

    footer {
      border-top: 1px solid var(--border);
      background: #0c1d34;
      padding: 22px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-top: 9px;
    }

    .footer-links a:hover {
      color: var(--primary);
    }

    @media (max-width: 520px) {
      .header-inner {
        align-items: flex-start;
      }

      .brand {
        font-size: 16px;
      }

      .btn {
        padding: 8px 10px;
        font-size: 13px;
      }

      main {
        padding-top: 25px;
      }

      .articles-grid {
        grid-template-columns: 1fr;
      }

      .lesson-section {
        padding: 15px;
      }
    }
  </style>
</head>

<script>
"use strict";

/* =====================================
   QUIZ MASTER ARTICLES CONFIGURATION
===================================== */

const ARTICLES_URL = "./articles.json";


/* =====================================
   TRANSLATIONS
===================================== */

const translations = {

  en: {
    pageTitle: "Learning Centre",

    pageDescription:
      "Explore useful lessons and improve your knowledge through English and Kinyarwanda articles.",

    searchPlaceholder: "Search lessons...",

    all: "All",

    general: "General Knowledge",

    traffic: "Road Safety",

    readMore: "Read lesson →",

    back: "← Back to lessons",

    home: "Home",

    about: "About",

    contact: "Contact",

    privacy: "Privacy Policy",

    terms: "Terms",

    loading: "Loading lessons...",

    results: "lessons found",

    noResults:
      "No lessons found. Try another search.",

    loadError:
      "Unable to load lessons. Please check your internet connection and try again.",

    invalidData:
      "The articles file contains invalid data. Please check articles.json.",

    articleNotFound:
      "This lesson could not be found.",

    trafficLabel: "Road Safety",

    generalLabel: "General Knowledge",

    definition: "Definition",

    body: "Main Lesson",

    keyPoints: "Key Points",

    conclusion: "Conclusion",

    footer:
      "© Quiz Master Rwanda. Learn • Play • Improve."
  },

  rw: {
    pageTitle: "Isomero ry'Ubwenge",

    pageDescription:
      "Soma amasomo agufasha kongera ubumenyi mu Kinyarwanda no mu Cyongereza.",

    searchPlaceholder: "Shakisha amasomo...",

    all: "Byose",

    general: "Ubumenyi Rusange",

    traffic: "Amategeko y'Umuhanda",

    readMore: "Soma isomo →",

    back: "← Subira ku masomo",

    home: "Ahabanza",

    about: "Abo turi bo",

    contact: "Twandikire",

    privacy: "Politiki y'Ibanga",

    terms: "Amategeko",

    loading: "Amasomo arimo gufunguka...",

    results: "amasomo yabonetse",

    noResults:
      "Nta somo ribonetse. Gerageza gushakisha andi magambo.",

    loadError:
      "Ntibishobotse gufungura amasomo. Reba internet wongere ugerageze.",

    invalidData:
      "Amakuru yo muri articles.json afite amakosa. Ongera ugenzure iyo dosiye.",

    articleNotFound:
      "Iri somo ntiryabonetse.",

    trafficLabel: "Amategeko y'Umuhanda",

    generalLabel: "Ubumenyi Rusange",

    definition: "Ibisobanuro",

    body: "Inyigisho irambuye",

    keyPoints: "Ingingo z'ingenzi",

    conclusion: "Umwanzuro",

    footer:
      "© Quiz Master Rwanda. Iga • Kina • Ongera ubumenyi."
  }

};


/* =====================================
   APPLICATION STATE
===================================== */

let articles = [];

let currentLanguage = "en";

let currentCategory = "all";

let currentSearch = "";

let currentArticleId = null;


/* =====================================
   HTML ELEMENTS
===================================== */

const elements = {

  languageBtn:
    document.getElementById("languageBtn"),

  homeLink:
    document.getElementById("homeLink"),

  pageTitle:
    document.getElementById("pageTitle"),

  pageDescription:
    document.getElementById("pageDescription"),

  searchInput:
    document.getElementById("searchInput"),

  filterButtons:
    document.querySelectorAll(".filter-btn"),

  resultsInfo:
    document.getElementById("resultsInfo"),

  articlesGrid:
    document.getElementById("articlesGrid"),

  emptyMessage:
    document.getElementById("emptyMessage"),

  listSection:
    document.getElementById("listSection"),

  readerSection:
    document.getElementById("readerSection"),

  readerCategory:
    document.getElementById("readerCategory"),

  readerTitle:
    document.getElementById("readerTitle"),

  readerDescription:
    document.getElementById("readerDescription"),

  readerContent:
    document.getElementById("readerContent"),

  backBtn:
    document.getElementById("backBtn"),

  errorMessage:
    document.getElementById("errorMessage"),

  footerText:
    document.getElementById("footerText"),

  footerHome:
    document.getElementById("footerHome"),

  footerAbout:
    document.getElementById("footerAbout"),

  footerContact:
    document.getElementById("footerContact"),

  footerPrivacy:
    document.getElementById("footerPrivacy"),

  footerTerms:
    document.getElementById("footerTerms")

};


/* =====================================
   TRANSLATION HELPER
===================================== */

function t(key) {

  return (
    translations[currentLanguage][key] ||
    translations.en[key] ||
    key
  );

}


/* =====================================
   GET LOCALIZED JSON VALUE

   Supports:
   - Normal strings
   - { en: "...", rw: "..." }
   - Arrays of localized strings
===================================== */

function getLocalizedValue(value) {

  if (typeof value === "string") {
    return value;
  }

  if (Array.isArray(value)) {

    return value
      .map(item => getLocalizedValue(item))
      .filter(Boolean)
      .join("\n");

  }

  if (
    value &&
    typeof value === "object"
  ) {

    const selected =
      value[currentLanguage];

    if (
      typeof selected === "string" &&
      selected.trim()
    ) {
      return selected;
    }

    if (Array.isArray(selected)) {

      return selected
        .map(item => getLocalizedValue(item))
        .filter(Boolean)
        .join("\n");

    }

    const english = value.en;

    if (
      typeof english === "string" &&
      english.trim()
    ) {
      return english;
    }

    const kinyarwanda = value.rw;

    if (
      typeof kinyarwanda === "string" &&
      kinyarwanda.trim()
    ) {
      return kinyarwanda;
    }

  }

  return "";

}


/* =====================================
   CHECK WHETHER A VALUE HAS CONTENT
===================================== */

function hasLocalizedValue(value) {

  if (typeof value === "string") {
    return value.trim().length > 0;
  }

  if (Array.isArray(value)) {

    return value.some(item =>
      hasLocalizedValue(item)
    );

  }

  if (
    value &&
    typeof value === "object"
  ) {

    return (
      hasLocalizedValue(value.en) ||
      hasLocalizedValue(value.rw)
    );

  }

  return false;

}


/* =====================================
   VALIDATE ARTICLES JSON
===================================== */

function validateArticles(data) {

  if (
    !data ||
    typeof data !== "object" ||
    Array.isArray(data)
  ) {

    throw new Error("Invalid JSON structure.");

  }

  if (!Array.isArray(data.articles)) {

    throw new Error("Missing articles array.");

  }

  const validCategories = [
    "traffic",
    "general"
  ];

  const seenIds = new Set();

  const validArticles = [];

  data.articles.forEach(article => {

    if (
      !article ||
      typeof article !== "object" ||
      Array.isArray(article)
    ) {
      return;
    }

    if (
      typeof article.id !== "string" ||
      !article.id.trim()
    ) {
      return;
    }

    if (seenIds.has(article.id)) {
      return;
    }

    if (
      typeof article.category !== "string" ||
      !validCategories.includes(article.category)
    ) {
      return;
    }

    const hasTitle =
      hasLocalizedValue(article.title);

    const hasDescription =
      hasLocalizedValue(article.description);

    const hasStructuredContent =
      hasLocalizedValue(article.definition) ||
      hasLocalizedValue(article.body) ||
      hasLocalizedValue(article.key_points) ||
      hasLocalizedValue(article.conclusion);

    const hasOldContent =
      hasLocalizedValue(article.content);

    if (
      !hasTitle ||
      !hasDescription ||
      (
        !hasStructuredContent &&
        !hasOldContent
      )
    ) {
      return;
    }

    seenIds.add(article.id);

    validArticles.push(article);

  });

  if (validArticles.length === 0) {

    throw new Error("No valid articles found.");

  }

  return validArticles;

}


/* =====================================
   LOAD ARTICLES FROM JSON
===================================== */

async function loadArticles() {

  elements.resultsInfo.textContent =
    t("loading");

  elements.articlesGrid.innerHTML = "";

  elements.errorMessage.classList.add("hidden");

  try {

    const response = await fetch(
      ARTICLES_URL,
      {
        method: "GET",
        cache: "no-store",
        headers: {
          "Accept": "application/json"
        }
      }
    );

    if (!response.ok) {

      throw new Error(
        "HTTP error: " + response.status
      );

    }

    const data = await response.json();

    articles = validateArticles(data);

    renderArticles();

  } catch (error) {

    console.error(
      "Quiz Master Articles Error:",
      error
    );

    elements.resultsInfo.textContent = "";

    elements.articlesGrid.innerHTML = "";

    elements.emptyMessage.classList.add("hidden");

    elements.errorMessage.textContent =
      error instanceof SyntaxError
        ? t("invalidData")
        : t("loadError");

    elements.errorMessage.classList.remove("hidden");

  }

}


/* =====================================
   CATEGORY LABEL
===================================== */

function getCategoryLabel(category) {

  if (category === "traffic") {
    return t("trafficLabel");
  }

  return t("generalLabel");

}


/* =====================================
   GET ALL SEARCHABLE ARTICLE TEXT
===================================== */

function getSearchableArticleText(article) {

  const fields = [

    article.id,

    article.category,

    getLocalizedValue(article.title),

    getLocalizedValue(article.description),

    getLocalizedValue(article.definition),

    getLocalizedValue(article.body),

    getLocalizedValue(article.key_points),

    getLocalizedValue(article.conclusion),

    getLocalizedValue(article.content)

  ];

  return fields
    .join(" ")
    .toLowerCase();

}


/* =====================================
   SEARCH AND FILTER
===================================== */

function getFilteredArticles() {

  return articles.filter(article => {

    const matchesCategory =
      currentCategory === "all" ||
      article.category === currentCategory;

    const searchableText =
      getSearchableArticleText(article);

    const matchesSearch =
      searchableText.includes(
        currentSearch.toLowerCase()
      );

    return (
      matchesCategory &&
      matchesSearch
    );

  });

}


/* =====================================
   DISPLAY ARTICLES
===================================== */

function renderArticles() {

  const filteredArticles =
    getFilteredArticles();

  elements.articlesGrid.innerHTML = "";

  elements.emptyMessage.classList.add("hidden");

  elements.resultsInfo.textContent =
    filteredArticles.length +
    " " +
    t("results");

  if (filteredArticles.length === 0) {

    elements.emptyMessage.textContent =
      t("noResults");

    elements.emptyMessage.classList.remove("hidden");

    return;

  }

  filteredArticles.forEach(article => {

    const card =
      document.createElement("article");

    card.className = "article-card";

    const category =
      document.createElement("span");

    category.className = "category-label";

    category.textContent =
      getCategoryLabel(article.category);

    const title =
      document.createElement("h2");

    title.textContent =
      getLocalizedValue(article.title);

    const description =
      document.createElement("p");

    description.textContent =
      getLocalizedValue(article.description);

    const readButton =
      document.createElement("button");

    readButton.type = "button";

    readButton.className = "read-link";

    readButton.textContent =
      t("readMore");

    readButton.addEventListener(
      "click",
      () => openArticle(article.id)
    );

    card.appendChild(category);

    card.appendChild(title);

    card.appendChild(description);

    card.appendChild(readButton);

    elements.articlesGrid.appendChild(card);

  });

}


/* =====================================
   CREATE A LESSON SECTION
===================================== */

function createLessonSection(title, value) {

  const content =
    getLocalizedValue(value);

  if (!content.trim()) {
    return null;
  }

  const section =
    document.createElement("section");

  section.className = "lesson-section";

  const heading =
    document.createElement("h2");

  heading.textContent = title;

  const paragraph =
    document.createElement("p");

  paragraph.textContent = content;

  section.appendChild(heading);

  section.appendChild(paragraph);

  return section;

}


/* =====================================
   CREATE KEY POINTS SECTION

   Supports:
   key_points.en = ["...", "..."]
   key_points.rw = ["...", "..."]

   Also supports a normal string.
===================================== */

function createKeyPointsSection(value) {

  if (!hasLocalizedValue(value)) {
    return null;
  }

  const section =
    document.createElement("section");

  section.className = "lesson-section";

  const heading =
    document.createElement("h2");

  heading.textContent =
    t("keyPoints");

  section.appendChild(heading);

  const list =
    document.createElement("ul");

  let points = [];

  if (Array.isArray(value)) {

    points = value
      .map(item => getLocalizedValue(item));

  } else if (
    value &&
    typeof value === "object"
  ) {

    const selected =
      value[currentLanguage];

    if (Array.isArray(selected)) {

      points = selected.map(item =>
        getLocalizedValue(item)
      );

    } else {

      const text =
        getLocalizedValue(value);

      points = text
        ? text.split("\n")
        : [];

    }

  } else {

    points = getLocalizedValue(value)
      .split("\n");

  }

  points
    .map(point => String(point).trim())
    .filter(Boolean)
    .forEach(point => {

      const item =
        document.createElement("li");

      item.textContent = point;

      list.appendChild(item);

    });

  if (list.children.length === 0) {
    return null;
  }

  section.appendChild(list);

  return section;

}


/* =====================================
   DISPLAY STRUCTURED ARTICLE

   Displays:
   1. Definition
   2. Main lesson
   3. Key points
   4. Conclusion
===================================== */

function renderStructuredArticle(article) {

  elements.readerContent.innerHTML = "";

  const definition =
    createLessonSection(
      t("definition"),
      article.definition
    );

  const body =
    createLessonSection(
      t("body"),
      article.body
    );

  const keyPoints =
    createKeyPointsSection(
      article.key_points
    );

  const conclusion =
    createLessonSection(
      t("conclusion"),
      article.conclusion
    );

  const sections = [
    definition,
    body,
    keyPoints,
    conclusion
  ];

  sections.forEach(section => {

    if (section) {

      elements.readerContent.appendChild(section);

    }

  });

}


/* =====================================
   DISPLAY LEGACY CONTENT

   Keeps compatibility with older JSON:
   content.en and content.rw
===================================== */

function renderLegacyContent(article) {

  elements.readerContent.innerHTML = "";

  const content =
    getLocalizedValue(article.content);

  if (!content.trim()) {
    return;
  }

  const paragraph =
    document.createElement("p");

  paragraph.textContent = content;

  elements.readerContent.appendChild(paragraph);

}


/* =====================================
   OPEN ONE ARTICLE
===================================== */

function openArticle(articleId) {

  const article =
    articles.find(item =>
      item.id === articleId
    );

  if (!article) {

    elements.errorMessage.textContent =
      t("articleNotFound");

    elements.errorMessage.classList.remove("hidden");

    return;

  }

  currentArticleId = articleId;

  elements.readerCategory.textContent =
    getCategoryLabel(article.category);

  elements.readerTitle.textContent =
    getLocalizedValue(article.title);

  elements.readerDescription.textContent =
    getLocalizedValue(article.description);

  const hasStructuredContent =
    hasLocalizedValue(article.definition) ||
    hasLocalizedValue(article.body) ||
    hasLocalizedValue(article.key_points) ||
    hasLocalizedValue(article.conclusion);

  if (hasStructuredContent) {

    renderStructuredArticle(article);

  } else {

    renderLegacyContent(article);

  }

  elements.listSection.classList.add("hidden");

  elements.readerSection.classList.remove("hidden");

  elements.errorMessage.classList.add("hidden");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================
   BACK TO ARTICLES
===================================== */

function showArticleList() {

  currentArticleId = null;

  elements.readerSection.classList.add("hidden");

  elements.listSection.classList.remove("hidden");

  elements.errorMessage.classList.add("hidden");

  renderArticles();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================
   CHANGE LANGUAGE
===================================== */

function setLanguage(language) {

  if (
    language !== "en" &&
    language !== "rw"
  ) {
    return;
  }

  currentLanguage = language;

  document.documentElement.lang =
    language;

  elements.languageBtn.textContent =
    language === "en"
      ? "Kinyarwanda"
      : "English";

  elements.pageTitle.textContent =
    t("pageTitle");

  elements.pageDescription.textContent =
    t("pageDescription");

  elements.searchInput.placeholder =
    t("searchPlaceholder");

  elements.searchInput.setAttribute(
    "aria-label",
    t("searchPlaceholder")
  );

  elements.homeLink.textContent =
    t("home");

  elements.footerHome.textContent =
    t("home");

  elements.footerAbout.textContent =
    t("about");

  elements.footerContact.textContent =
    t("contact");

  elements.footerPrivacy.textContent =
    t("privacy");

  elements.footerTerms.textContent =
    t("terms");

  elements.footerText.textContent =
    t("footer");

  elements.backBtn.textContent =
    t("back");

  elements.filterButtons.forEach(button => {

    const category =
      button.dataset.category;

    button.textContent =
      category === "all"
        ? t("all")
        : category === "traffic"
          ? t("traffic")
          : t("general");

  });

  if (currentArticleId) {

    openArticle(currentArticleId);

  } else {

    renderArticles();

  }

}


/* =====================================
   LANGUAGE BUTTON
===================================== */

elements.languageBtn.addEventListener(
  "click",
  () => {

    setLanguage(
      currentLanguage === "en"
        ? "rw"
        : "en"
    );

  }
);


/* =====================================
   SEARCH INPUT
===================================== */

elements.searchInput.addEventListener(
  "input",
  event => {

    currentSearch =
      event.target.value.trim();

    renderArticles();

  }
);


/* =====================================
   CATEGORY FILTER BUTTONS
===================================== */

elements.filterButtons.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      currentCategory =
        button.dataset.category;

      elements.filterButtons.forEach(item => {

        item.classList.remove("active");

        item.setAttribute(
          "aria-pressed",
          "false"
        );

      });

      button.classList.add("active");

      button.setAttribute(
        "aria-pressed",
        "true"
      );

      renderArticles();

    }
  );

});


/* =====================================
   BACK BUTTON
===================================== */

elements.backBtn.addEventListener(
  "click",
  showArticleList
);


/* =====================================
   BROWSER BACK BUTTON
===================================== */

window.addEventListener(
  "popstate",
  () => {

    if (currentArticleId) {

      showArticleList();

    }

  }
);


/* =====================================
   START APPLICATION
===================================== */

setLanguage("en");

loadArticles();

</script>

</body>
</html>
