    * {

    body {
      margin: 0;

      background: #111827;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .screen {
      display: none;
    }

    .screen.active {

    }

    .card {
      background: #1f2937;
      border-radius: 18px;
      padding: 24px;
      margin-top: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.25);
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      margin: 10px auto 15px;
    }

    h1, h2, h3 {
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;

    button.secondary {
      background: #374151;
    }

    button.success {
      background: #059669;
    }

    button.warning {
      background: #d97706;

    button.danger {
      background: #dc2626;

    button:disabled {
      opacity: .45;
      cursor: not-allowed;

      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .round-btn {
      margin: 0;
      min-height: 75px;
      background: #374151;
    }

    .round-btn.unlocked {
      background: #2563eb;
    }

    .round-btn.completed {
      background: #059669;
    }

    .round-btn.locked {
      background: #4b5563;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 15px;
    }

    .topbar span {
      background: #374151;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 14px;
    }

    .progress {
      height: 8px;
      background: #374151;
      border-radius: 10px;
      overflow: hidden;
      margin: 15px 0;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #22c55e;
      transition: width .3s;
    }

    .question {
      font-size: 21px;
      font-weight: bold;
      line-height: 1.4;
      margin: 20px 0;
    }

    .option {
      background: #374151;
      text-align: left;
      margin-top: 10px;
    }

    .option.correct {
      background: #059669;
    }

    .option.wrong {
      background: #dc2626;
    }

    .timer {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin: 10px 0;
    }

    .score {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #22c55e;
      margin: 20px 0;
    }

    .message {
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      background: #374151;
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #374151;
      padding: 15px;
      border-radius: 12px;
      margin-top: 12px;
    }

      height: 30px;
      background: #6b7280;
      border-radius: 30px;
      position: relative;
      cursor: pointer;
    }

      height: 24px;
      background: white;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: .2s;
    }

    .switch.on {
      background: #16a34a;
    }

      left: 28px;
    }
