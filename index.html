<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quiz Master 🇷🇼</title>

  <meta name="theme-color" content="#111827">
  <meta name="description" content="Quiz Master - Gerageza ubumenyi bwawe">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: #1f2937;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #d1d5db;
      margin-bottom: 25px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }

    .badge {
      background: #374151;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: bold;
    }

    #timer {
      background: #dc2626;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: bold;
    }

    .progress {
      height: 8px;
      background: #374151;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 25px;
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background: #22c55e;
      transition: width 0.3s;
    }

    #question {
      font-size: 22px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer {
      width: 100%;
      padding: 15px;
      border: 2px solid #4b5563;
      border-radius: 12px;
      background: #374151;
      color: white;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .answer:hover {
      background: #4b5563;
    }

    .answer.correct {
      background: #15803d;
      border-color: #22c55e;
    }

    .answer.wrong {
      background: #b91c1c;
      border-color: #ef4444;
    }

    .answer:disabled {
      cursor: not-allowed;
      opacity: 0.95;
    }

    #nextBtn,
    #restartBtn {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #nextBtn:hover,
    #restartBtn:hover {
      background: #1d4ed8;
    }

    .hidden {
      display: none !important;
    }

    #result {
      text-align: center;
    }

    #result h2 {
      font-size: 30px;
      margin-bottom: 15px;
    }

    #finalScore {
      font-size: 22px;
      margin: 15px 0;
    }

    .error {
      background: #7f1d1d;
      border: 1px solid #ef4444;
      padding: 15px;
      border-radius: 10px;
      line-height: 1.5;
    }

    @media (max-width: 500px) {
      .container {
        padding: 18px;
      }

      h1 {
        font-size: 25px;
      }

      #question {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- START -->
    <section id="startScreen">
      <h1>Quiz Master 🇷🇼</h1>
      <p class="subtitle">
        Gerageza ubumenyi bwawe!
      </p>

      <button id="startBtn">Tangira Quiz</button>
    </section>

    <!-- QUIZ -->
    <section id="quizScreen" class="hidden">

      <div class="top">
        <div class="badge">
          Ikibazo <span id="questionNumber">1</span>/10
        </div>

        <div id="timer">
          ⏱️ <span id="time">20</span>s
        </div>
      </div>

      <div class="progress">
        <div id="progressBar"></div>
      </div>

      <h2 id="question">Loading...</h2>

      <div id="answers" class="answers"></div>

      <button id="nextBtn" class="hidden">
        Ikibazo gikurikira →
      </button>

    </section>

    <!-- RESULT -->
    <section id="result" class="hidden">

      <h2>🎉 Quiz Irangiye!</h2>

      <p id="finalScore"></p>

      <button id="restartBtn">
        Ongera utangire
      </button>

    </section>

    <!-- ERROR -->
    <section id="errorScreen" class="hidden">
      <div class="error">
        <strong>Habaye ikibazo.</strong>
        <br><br>
        Ntabwo nabashije kubona questions.
        Reba niba <b>questions.js</b> iri muri folder imwe na
        <b>index.html</b>.
      </div>
    </section>

  </main>

  <!--
    IMPORTANT:
    questions.js igomba kuba muri folder imwe na index.html.
  -->
  <script src="./questions.js"></script>

  <script>
    const TOTAL_QUESTIONS = 10;
    const TIME_PER_QUESTION = 20;

    let questions = [];
    let quizQuestions = [];
    let currentQuestion = 0;
    let score = 0;
    let timeLeft = TIME_PER_QUESTION;
    let timer = null;
    let answered = false;

    const startScreen = document.getElementById("startScreen");
    const quizScreen = document.getElementById("quizScreen");
    const resultScreen = document.getElementById("result");
    const errorScreen = document.getElementById("errorScreen");

    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const nextBtn = document.getElementById("nextBtn");

    const questionNumber = document.getElementById("questionNumber");
    const questionText = document.getElementById("question");
    const answersBox = document.getElementById("answers");

    const timeText = document.getElementById("time");
    const progressBar = document.getElementById("progressBar");
    const finalScore = document.getElementById("finalScore");

    /*
      Emera formats za questions.js:

      const questions = [
        {
          question: "Umurwa mukuru w'u Rwanda ni uwuhe?",
          answers: ["Kigali", "Huye", "Musanze", "Rubavu"],
          correct: 0
        }
      ];

      Cyangwa:

      const questions = [
        {
          question: "Umurwa mukuru w'u Rwanda ni uwuhe?",
          options: ["Kigali", "Huye", "Musanze", "Rubavu"],
          answer: "Kigali"
        }
      ];

      Iyi index.html igerageza kwakira formats zombi.
    */

    function getQuestions() {

      if (typeof window.questions !== "undefined") {
        return window.questions;
      }

      if (typeof window.quizQuestions !== "undefined") {
        return window.quizQuestions;
      }

      if (typeof window.QUESTIONS !== "undefined") {
        return window.QUESTIONS;
      }

      return [];
    }

    function shuffle(array) {
      const copy = [...array];

      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] = [copy[j], copy[i]];
      }

      return copy;
    }

    function getQuestionText(q) {
      return q.question || q.questionText || q.text || "";
    }

    function getOptions(q) {
      return q.answers || q.options || q.choices || [];
    }

    function getCorrectAnswer(q) {

      if (typeof q.correct === "number") {
        return q.correct;
      }

      if (typeof q.answer === "number") {
        return q.answer;
      }

      const options = getOptions(q);

      if (typeof q.correct === "string") {
        return options.indexOf(q.correct);
      }

      if (typeof q.answer === "string") {
        return options.indexOf(q.answer);
      }

      return -1;
    }

    function startQuiz() {

      questions = getQuestions();

      if (!Array.isArray(questions) || questions.length === 0) {
        startScreen.classList.add("hidden");
        errorScreen.classList.remove("hidden");
        return;
      }

      quizQuestions = shuffle(questions).slice(
        0,
        Math.min(TOTAL_QUESTIONS, questions.length)
      );

      currentQuestion = 0;
      score = 0;

      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      errorScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");

      showQuestion();
    }

    function showQuestion() {

      clearInterval(timer);

      answered = false;
      nextBtn.classList.add("hidden");

      const q = quizQuestions[currentQuestion];

      questionNumber.textContent =
        currentQuestion + 1;

      questionText.textContent =
        getQuestionText(q);

      progressBar.style.width =
        ((currentQuestion + 1) / quizQuestions.length * 100) + "%";

      answersBox.innerHTML = "";

      const options = getOptions(q);

      options.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "answer";
        button.textContent = option;

        button.addEventListener("click", () => {
          selectAnswer(button, index);
        });

        answersBox.appendChild(button);
      });

      startTimer();
    }

    function startTimer() {

      timeLeft = TIME_PER_QUESTION;
      timeText.textContent = timeLeft;

      timer = setInterval(() => {

        timeLeft--;

        timeText.textContent = timeLeft;

        if (timeLeft <= 0) {

          clearInterval(timer);

          if (!answered) {
            selectAnswer(null, -1);
          }
        }

      }, 1000);
    }

    function selectAnswer(selectedButton, selectedIndex) {

      if (answered) return;

      answered = true;

      clearInterval(timer);

      const q = quizQuestions[currentQuestion];

      const correctIndex = getCorrectAnswer(q);

      const buttons =
        answersBox.querySelectorAll(".answer");

      buttons.forEach((button, index) => {

        button.disabled = true;

        if (index === correctIndex) {
          button.classList.add("correct");
        }

      });

      if (selectedIndex === correctIndex) {

        score++;

        if (selectedButton) {
          selectedButton.classList.add("correct");
        }

      } else {

        if (selectedButton) {
          selectedButton.classList.add("wrong");
        }
      }

      nextBtn.classList.remove("hidden");
    }

    function nextQuestion() {

      if (!answered) return;

      currentQuestion++;

      if (currentQuestion >= quizQuestions.length) {
        finishQuiz();
      } else {
        showQuestion();
      }
    }

    function finishQuiz() {

      clearInterval(timer);

      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      finalScore.textContent =
        `Wabonye ${score} kuri ${quizQuestions.length}.`;

    }

    startBtn.addEventListener("click", startQuiz);

    restartBtn.addEventListener("click", startQuiz);

    nextBtn.addEventListener("click", nextQuestion);

    /*
      Reba niba questions.js yapakiwe.
    */
    window.addEventListener("load", () => {

      questions = getQuestions();

      if (!Array.isArray(questions) || questions.length === 0) {

        console.warn(
          "questions.js ntiyabonetse cyangwa nta questions zirimo."
        );

      } else {

        console.log(
          "Quiz Master: questions loaded =",
          questions.length
        );

      }

    });
  </script>

</body>
</html>
