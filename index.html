<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Master 🇷🇼🌍</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef3f8;
    color:#111;
}

.container{
    max-width:700px;
    margin:20px auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:22px;
    padding:25px;
    box-shadow:0 6px 25px rgba(0,0,0,.10);
}

.hidden{display:none}

.logo{text-align:center;font-size:55px}

h1{text-align:center;font-size:35px}

button{
    width:100%;
    border:0;
    border-radius:14px;
    padding:16px;
    margin-top:12px;
    font-size:18px;
    cursor:pointer;
}

.primary{background:#1677d2;color:white}
.secondary{background:#222;color:white}
.premium{background:#f3b400;color:#111}

input{
    width:100%;
    padding:16px;
    border:2px solid #ddd;
    border-radius:14px;
    font-size:18px;
    margin-top:15px;
}

.progress{
    text-align:center;
    color:#666;
    margin:15px;
}

.category{
    text-align:center;
    color:#777;
    font-weight:bold;
}

.question{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    line-height:1.4;
    margin:25px 0;
}

.answers{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.answer{
    background:#1976d2;
    color:white;
}

.answer.correct{background:#1ca354}
.answer.wrong{background:#e53935}

.answer:disabled{opacity:.95}

.result{text-align:center}

.resultScore{
    font-size:48px;
    font-weight:bold;
}

.ad{
    margin:20px 0;
    padding:20px;
    border:2px dashed #aaa;
    text-align:center;
    color:#777;
    border-radius:15px;
}

.player{
    display:flex;
    justify-content:space-between;
    padding:13px;
    margin:7px 0;
    background:#f2f4f7;
    border-radius:10px;
}

@media(max-width:500px){
    h1{font-size:30px}
    .question{font-size:21px}
}
</style>
</head>

<body>

<div class="container">

<!-- HOME -->
<div id="homeScreen" class="card">

    <div class="logo">🇷🇼🌍</div>

    <h1>Quiz Master</h1>

    <p style="text-align:center">
        Rwanda • Africa • World • Science • Sports • Technology
    </p>

    <input
        id="playerName"
        type="text"
        maxlength="25"
        placeholder="Andika izina ryawe"
    >

    <button class="primary" onclick="startFreeQuiz()">
        🆓 Tangira Free Quiz
    </button>

    <button class="premium" onclick="openPremium()">
        ⭐ Premium Quiz
    </button>

    <button class="secondary" onclick="showLeaderboard()">
        🏅 Leaderboard
    </button>

    <div class="ad">
        📢 ADVERTISEMENT<br>
        Ads nyazo zizongerwamo nyuma
    </div>

</div>


<!-- QUIZ -->
<div id="quizScreen" class="card hidden">

    <div class="progress" id="progress"></div>

    <div class="category" id="category"></div>

    <div class="question" id="question"></div>

    <div class="answers" id="answers"></div>

</div>


<!-- RESULT -->
<div id="resultScreen" class="card hidden">

    <div class="result">

        <h1>🎉 Quiz Irarangiye!</h1>

        <p id="resultName"></p>

        <div class="resultScore" id="resultScore"></div>

        <p id="resultMessage"></p>

        <button class="primary" onclick="startFreeQuiz()">
            🔄 Ongera Ukine
        </button>

        <button class="secondary" onclick="goHome()">
            🏠 Ahabanza
        </button>

    </div>

</div>


<!-- PREMIUM -->
<div id="premiumScreen" class="card hidden">

    <h1>⭐ Premium Quiz</h1>

    <p style="text-align:center">
        Premium Quiz izaza vuba.
    </p>

    <button class="primary" onclick="goHome()">
        🏠 Subira Ahabanza
    </button>

</div>


<!-- LEADERBOARD -->
<div id="leaderboardScreen" class="card hidden">

    <h1>🏅 Leaderboard</h1>

    <div id="leaderboard"></div>

    <button class="secondary" onclick="goHome()">
        🏠 Subira Ahabanza
    </button>

</div>

</div>


<script>

const questions = [

{
category:"🇷🇼 Rwanda",
question:"Umurwa mukuru w'u Rwanda ni uwuhe?",
answers:["Kigali","Huye","Musanze","Rubavu"],
correct:0
},

{
category:"🌍 Africa",
question:"Ni ikihe gihugu gifite Cairo nk'umurwa mukuru?",
answers:["Egypt","Kenya","Ghana","Nigeria"],
correct:0
},

{
category:"🔬 Science",
question:"Amazi agira formula iyihe?",
answers:["CO2","H2O","O2","NaCl"],
correct:1
},

{
category:"⚽ Sports",
question:"Ni iyihe sport ikinwa n'abakinnyi 11 kuri buri kipe?",
answers:["Basketball","Football","Tennis","Volleyball"],
correct:1
},

{
category:"💻 Technology",
question:"HTML ikoreshwa cyane mu gukora iki?",
answers:[
"Web pages",
"Amavuta",
"Imodoka",
"Imiti"
],
correct:0
}

];

let currentQuestion = 0;
let score = 0;
let player = "";


function hideAll(){

    document.getElementById("homeScreen").classList.add("hidden");
    document.getElementById("quizScreen").classList.add("hidden");
    document.getElementById("resultScreen").classList.add("hidden");
    document.getElementById("premiumScreen").classList.add("hidden");
    document.getElementById("leaderboardScreen").classList.add("hidden");

}


function startFreeQuiz(){

    player =
        document.getElementById("playerName").value.trim();

    if(player === ""){

        alert("Banza wandike izina ryawe.");

        return;
    }

    currentQuestion = 0;
    score = 0;

    hideAll();

    document
        .getElementById("quizScreen")
        .classList.remove("hidden");

    showQuestion();

}


function showQuestion(){

    const q = questions[currentQuestion];

    document.getElementById("progress").innerText =
        "Ikibazo " +
        (currentQuestion + 1) +
        " / " +
        questions.length;

    document.getElementById("category").innerText =
        q.category;

    document.getElementById("question").innerText =
        q.question;

    const answers =
        document.getElementById("answers");

    answers.innerHTML = "";

    q.answers.forEach((answer,index)=>{

        const button =
            document.createElement("button");

        button.className = "answer";

        button.innerText = answer;

        button.onclick = function(){

            checkAnswer(button,index);

        };

        answers.appendChild(button);

    });

}


function checkAnswer(button,index){

    const q = questions[currentQuestion];

    const buttons =
        document.querySelectorAll(".answer");

    buttons.forEach(b => b.disabled = true);

    if(index === q.correct){

        button.classList.add("correct");

        score++;

    }else{

        button.classList.add("wrong");

        buttons[q.correct].classList.add("correct");

    }

    setTimeout(()=>{

        currentQuestion++;

        if(currentQuestion < questions.length){

            showQuestion();

        }else{

            showResult();

        }

    },900);

}


function showResult(){

    hideAll();

    document
        .getElementById("resultScreen")
        .classList.remove("hidden");

    document.getElementById("resultName").innerText =
        "Umukinnyi: " + player;

    document.getElementById("resultScore").innerText =
        score + " / " + questions.length;

    document.getElementById("resultMessage").innerText =
        score === questions.length
        ? "🏆 Byiza cyane!"
        : "👏 Wakoze neza! Ongera ugerageze.function openPremium(){
  try {
    Pi.createPayment(
      {
        amount: 0.01,
        memo: "Premium Quiz",
        metadata: { app: "Quiz Master" }
      },
      {
        onReadyForServerApproval: function(paymentId){
          fetch("/api/pi/approve", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({paymentId: paymentId})
          });
        },

        onReadyForServerCompletion: function(paymentId, txid){
          fetch("/api/pi/complete", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({
              paymentId: paymentId,
              txid: txid
            })
          }).then(function(){
            alert("✅ Pi payment completed!");
          });
        },

        onCancel: function(){
          alert("Payment cancelled");
        },

        onError: function(error){
          console.error(error);
          alert("Payment error");
        }
      }
    );
  catch(error) {
  console.error(error);
  alert("Pi payment error: " + error.message);
}
}
function showLeaderboard(){

    hideAll();

    document
        .getElementById("leaderboardScreen")
        .classList.remove("hidden");

    document.getElementById("leaderboard").innerHTML =

        "<div class='player'><b>🥇 Player 1</b><span>5/5</span></div>" +

        "<div class='player'><b>🥈 Player 2</b><span>4/5</span></div>" +

        "<div class='player'><b>🥉 Player 3</b><span>3/5</span></div>";

}


function goHome(){

    hideAll();

    document
        .getElementById("homeScreen")
        .classList.remove("hidden");

}

</script>

</body>
</html>
