    .secondary-btn,
    .danger-btn {
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .main-btn {
      background: #2563eb;
      color: #ffffff;
    }

    .secondary-btn {
      background: #e5e7eb;
      color: #111827;
    }

    .danger-btn {
      background: #dc2626;
      color: #ffffff;
    }

    .main-btn:hover,
    .secondary-btn:hover,
    .danger-btn:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

      overflow: hidden;
    }

      background: #ffffff;

      padding: 24px;

    }

      margin-top: 0;
      color: #172554;
      font-size: 24px;
    }

    .content-card h3 {
      color: #1e3a8a;
      margin-bottom: 6px;
    }

    .content-card p {
      margin-top: 7px;
      color: #374151;
    }

      margin-top: 15px;
    }

      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      background: #f9fafb;
    }

    .category-card h3 {
      margin-top: 0;
      font-size: 17px;
    }

    .category-card p {
      margin-bottom: 0;
      font-size: 14px;
    }

      padding-left: 22px;
    }

      margin-bottom: 9px;
    }
